[toolchain]
anchor_version = "0.31.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sokketsu = "Fuceqdwk2uxT2nNREHC5QJiwKU9uwcnRqdnXD7bHiUwp"

[programs.devnet]
sokketsu = "Fuceqdwk2uxT2nNREHC5QJiwKU9uwcnRqdnXD7bHiUwp"

[provider]
cluster = "localnet"
wallet = ".keys/deployer.json"

# 8899 は別プロセスが使っているので、ローカル validator はずらす。
[test.validator]
rpc_port = 18899

[scripts]
# ts-mocha は mocha@12 を peer に持たないので、mocha に ts-node を直接読ませる。
# ts-mocha の既定と同じく型検査なし（transpile-only）で、./tsconfig.json を使う。
test = "TS_NODE_PROJECT=./tsconfig.json npx mocha -r ts-node/register/transpile-only -t 1000000 'tests/**/*.ts'"
