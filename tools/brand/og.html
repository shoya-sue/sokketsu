<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=RocknRoll+One&family=Unbounded:wght@900&family=M+PLUS+1p:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      #og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #f2f0fa;
        background:
          radial-gradient(1px 1px at 1px 1px, rgba(255, 255, 255, 0.07) 1px, transparent 0) 0 0 / 28px 28px,
          radial-gradient(60% 80% at 15% 20%, rgba(153, 69, 255, 0.45), transparent 70%),
          radial-gradient(50% 70% at 90% 90%, rgba(20, 241, 149, 0.3), transparent 70%),
          #07060d;
        font-family: "M PLUS 1p", sans-serif;
      }
      .rays {
        position: absolute;
        right: -260px;
        top: -260px;
        width: 900px;
        height: 900px;
        background: repeating-conic-gradient(from 0deg, rgba(20, 241, 149, 0.1) 0 6deg, transparent 6deg 18deg);
        mask: radial-gradient(closest-side, #000 20%, transparent 75%);
      }
      .brand {
        position: absolute;
        left: 80px;
        top: 90px;
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .brand img {
        width: 132px;
        height: 132px;
        filter: drop-shadow(0 18px 50px rgba(153, 69, 255, 0.7));
      }
      .brand h1 {
        margin: 0;
        font-family: "Dela Gothic One", sans-serif;
        font-weight: 400;
        font-size: 112px;
        line-height: 1;
        background: linear-gradient(135deg, #b98aff, #00d1ff 55%, #14f195);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tag {
        position: absolute;
        left: 84px;
        top: 270px;
        font-family: "RocknRoll One", sans-serif;
        font-size: 44px;
      }
      .num {
        position: absolute;
        left: 80px;
        bottom: 70px;
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      .num b {
        font-family: "Unbounded", sans-serif;
        font-weight: 900;
        font-size: 150px;
        line-height: 1;
        background: linear-gradient(180deg, #fff 20%, #14f195);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .num span {
        font-family: "RocknRoll One", sans-serif;
        font-size: 34px;
        color: #9a95b4;
      }
      .chip {
        position: absolute;
        right: 70px;
        bottom: 80px;
        padding: 12px 26px;
        border-radius: 999px;
        border: 2px solid rgba(20, 241, 149, 0.6);
        color: #14f195;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="rays"></div>
      <div class="brand">
        <img src="../../app/public/logo-mark.svg" alt="" />
        <h1>Sokketsu</h1>
      </div>
      <div class="tag">型付き判断で止めて、1 秒未満で即決。</div>
      <div class="num"><b>&lt;1s</b><span>Alpenglow devnet で確定</span></div>
      <div class="chip">Solana devnet</div>
    </div>
  </body>
</html>
