<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sokketsu">
  <!-- 即決のマーク: 12 片の判断リング（金庫）を稲妻が貫く。フォントを使わない図形だけで描く -->
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945ff" />
      <stop offset="0.55" stop-color="#00d1ff" />
      <stop offset="1" stop-color="#14f195" />
    </linearGradient>
    <linearGradient id="sk-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fff3c4" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#sk-bg)" />
  <circle cx="64" cy="64" r="42" fill="#07060d" opacity="0.9" />
  <!-- 外周の 12 片（30° ごと・6° の隙間） -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#sk-bg)" stroke-width="7" stroke-dasharray="17.6 4.4" transform="rotate(-87 64 64)" />
  <path d="M72 22 L41 71 H60 L53 106 L88 54 H68 Z" fill="url(#sk-bolt)" stroke="#07060d" stroke-width="3" stroke-linejoin="round" />
</svg>
